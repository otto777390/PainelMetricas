<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Painel de Vendas</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="acesso.js"></script>
    <script>PainelAcesso.pularSeLogado();</script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }

        body {
            background-color: #ffe600;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .logo { margin-bottom: 34px; }
        .logo img { height: 52px; width: auto; display: block; }

        .cartao {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 14px rgba(0,0,0,.08);
            padding: 44px 40px 38px;
        }

        .cartao h1 { font-size: 24px; font-weight: 600; color: #2b2b2b; text-align: center; }
        .subtitulo { font-size: 14px; color: #666; text-align: center; margin-top: 10px; margin-bottom: 32px; }

        .campo { margin-bottom: 20px; }
        .campo label { display: block; font-size: 13px; color: #4a5568; margin-bottom: 8px; }
        .campo input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            font-size: 14px;
            color: #333;
            background: #eef1f8;
            border: 1px solid transparent;
            border-radius: 6px;
            outline: none;
            transition: border-color .15s, background-color .15s;
        }
        .campo input:focus { border-color: #3483fa; background: #fff; }
        .campo input::placeholder { color: #9aa3b2; }

        .btn-entrar {
            width: 100%;
            height: 50px;
            margin-top: 8px;
            background: #3483fa;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color .15s;
        }
        .btn-entrar:hover { background: #2968c8; }
        .btn-entrar:disabled { background: #a9c6f5; cursor: default; }

        .erro {
            display: none;
            margin-top: 16px;
            padding: 11px 14px;
            background: #fdecee;
            border-radius: 6px;
            font-size: 13px;
            color: #c1374a;
            text-align: center;
        }
        .erro.visivel { display: block; }

        .divisor {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 30px 0 18px;
            font-size: 13px;
            color: #999;
        }
        .divisor::before, .divisor::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e6e6e6;
        }

        .aviso { font-size: 12.5px; color: #b0b0b0; text-align: center; line-height: 1.6; }

        .rodape { margin-top: 26px; font-size: 12.5px; color: #8a7f00; text-align: center; }
    </style>
</head>
<body>

    <div class="logo">
        <img src="https://http2.mlstatic.com/frontend-assets/ml-web-navigation/ui-navigation/7.35.0/mercadolibre/pt_logo_large_plus@2x.webp"
             alt="Mercado Livre">
    </div>

    <div class="cartao">
        <h1>Painel de Vendas</h1>
        <p class="subtitulo">Acesse com sua conta para continuar</p>

        <form id="form-login" novalidate>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="username"
                       placeholder="seuemail@gmail.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password"
                       placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-entrar" id="btn-entrar">Entrar</button>
            <div class="erro" id="erro"></div>
        </form>

        <div class="divisor">Acesso restrito</div>
        <p class="aviso">
            Este painel é exclusivo para vendedores autorizados.<br>
            Entre em contato com o administrador para obter acesso.
        </p>
    </div>

    <p class="rodape">© 2026 Mercado Livre. Todos os direitos reservados.</p>

    <script>
        const form = document.getElementById('form-login');
        const campoEmail = document.getElementById('email');
        const campoSenha = document.getElementById('senha');
        const caixaErro = document.getElementById('erro');
        const botao = document.getElementById('btn-entrar');

        function mostrarErro(texto) {
            caixaErro.textContent = texto;
            caixaErro.classList.add('visivel');
        }

        function limparErro() {
            caixaErro.classList.remove('visivel');
        }

        campoEmail.addEventListener('input', limparErro);
        campoSenha.addEventListener('input', limparErro);

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            limparErro();

            const email = campoEmail.value.trim();
            const senha = campoSenha.value;

            if (!email || !senha) {
                mostrarErro('Preencha o e-mail e a senha.');
                return;
            }

            botao.disabled = true;
            botao.textContent = 'Entrando...';

            /* Pequena espera só para o clique não parecer travado. */
            setTimeout(function () {
                if (PainelAcesso.entrar(email, senha)) {
                    location.replace('index.html');
                    return;
                }
                botao.disabled = false;
                botao.textContent = 'Entrar';
                mostrarErro('E-mail ou senha incorretos.');
                campoSenha.value = '';
                campoSenha.focus();
            }, 350);
        });

        campoEmail.focus();
    </script>
</body>
</html>
