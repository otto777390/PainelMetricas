<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso restrito - Administração</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="acesso.js"></script>
    <script>PainelAcesso.exigirLogin();</script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background: #ffe600; min-height: 100vh; display: flex; flex-direction: column;
               align-items: center; justify-content: center; padding: 40px 20px; }

        .cartao { width: 100%; max-width: 400px; background: #fff; border-radius: 12px;
                  box-shadow: 0 2px 14px rgba(0,0,0,.08); padding: 40px 36px 32px; text-align: center; }

        .cadeado { width: 54px; height: 54px; margin: 0 auto 20px; border-radius: 50%;
                   background: #fff6cc; color: #8a6410; display: flex; align-items: center;
                   justify-content: center; font-size: 22px; }

        h1 { font-size: 20px; font-weight: 600; color: #2b2b2b; }
        .sub { font-size: 14px; color: #666; margin-top: 9px; margin-bottom: 26px; line-height: 1.5; }

        .campo { text-align: left; margin-bottom: 18px; }
        .campo label { display: block; font-size: 13px; color: #4a5568; margin-bottom: 7px; }
        .campo input { width: 100%; height: 46px; padding: 0 14px; font-size: 14px; color: #333;
                       background: #eef1f8; border: 1px solid transparent; border-radius: 6px; outline: none; }
        .campo input:focus { border-color: #3483fa; background: #fff; }

        .btn { width: 100%; height: 48px; background: #3483fa; color: #fff; font-size: 15px;
               font-weight: 600; border: none; border-radius: 6px; cursor: pointer; }
        .btn:hover { background: #2968c8; }
        .btn:disabled { background: #a9c6f5; cursor: default; }

        .erro { display: none; margin-bottom: 16px; padding: 11px 14px; background: #fdecee;
                border-radius: 6px; font-size: 13px; color: #c1374a; }
        .erro.visivel { display: block; }

        .voltar { display: inline-block; margin-top: 20px; font-size: 13px; color: #666; text-decoration: none; }
        .voltar:hover { text-decoration: underline; }
        .nota { font-size: 12.5px; color: #aaa; margin-top: 16px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="cartao">
        <div class="cadeado">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10.5" width="16" height="11" rx="2"/>
                <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
            </svg>
        </div>

        <h1 id="titulo">Acesso restrito</h1>
        <p class="sub" id="subtitulo">Esta área pede uma senha própria, além da sua conta.</p>

        <div class="erro" id="erro"></div>

        <form id="form">
            <div class="campo">
                <label for="senha" id="rotulo">Senha da administração</label>
                <input type="password" id="senha" autocomplete="off" required>
            </div>
            <button type="submit" class="btn" id="btn">Entrar</button>
        </form>

        <a class="voltar" href="index.html">← Voltar ao painel</a>
        <p class="nota" id="nota">A liberação vale 60 minutos nesta sessão.</p>
    </div>

    <script src="olho.js"></script>
    <script>
        const form = document.getElementById('form');
        const campo = document.getElementById('senha');
        const caixaErro = document.getElementById('erro');
        const botao = document.getElementById('btn');
        let primeiraVez = false;

        function erro(txt) { caixaErro.textContent = txt; caixaErro.classList.add('visivel'); }
        campo.addEventListener('input', function () { caixaErro.classList.remove('visivel'); });

        /* Se a senha ainda não existe, a tela vira "criar senha". */
        PainelAcesso.api('admin-acesso').then(function (r) {
            if (r.ok && !r.configurada) {
                primeiraVez = true;
                document.getElementById('titulo').textContent = 'Defina a senha da administração';
                document.getElementById('subtitulo').textContent =
                    'Esta é a primeira vez. Escolha a senha que vai proteger esta área — ela é separada da senha da sua conta.';
                document.getElementById('rotulo').textContent = 'Nova senha da administração';
                document.getElementById('nota').textContent =
                    'Mínimo de 6 caracteres. Guardada apenas como hash no servidor.';
                botao.textContent = 'Definir e entrar';
            }
            campo.focus();
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            caixaErro.classList.remove('visivel');

            const senha = campo.value;
            if (!senha) { erro('Digite a senha.'); return; }

            botao.disabled = true;
            botao.textContent = primeiraVez ? 'Salvando…' : 'Entrando…';

            PainelAcesso.api('admin-acesso', { method: 'POST', body: JSON.stringify({ senha: senha }) })
                .then(function (r) {
                    if (r.ok) { location.replace('admin.html'); return; }
                    botao.disabled = false;
                    botao.textContent = primeiraVez ? 'Definir e entrar' : 'Entrar';
                    erro(r.mensagem || 'Senha incorreta.');
                    campo.value = '';
                    campo.focus();
                });
        });
    </script>
</body>
</html>
